name: Android CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Unit tests (domain + app)
        run: |
          set -o pipefail
          ./gradlew --console=plain --continue :domain:test :app:testDebugUnitTest 2>&1 | tee test.log

      - name: UI smoke tests (Compose on Robolectric)
        timeout-minutes: 12
        continue-on-error: true
        run: |
          set -o pipefail
          # Keep the non-UI results: the UI run below rewrites app/build/test-results.
          mkdir -p unit-results && cp -r app/build/test-results/. unit-results/ 2>/dev/null || true
          ./gradlew --console=plain :app:testDebugUnitTest -PuiTests --tests 'app.liftos.ui.*' 2>&1 | tee ui.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew --console=plain :app:assembleDebug 2>&1 | tee assemble.log

      - name: Assemble release APK (R8-minified)
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --console=plain :app:assembleRelease 2>&1 | tee release.log

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liftos-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: liftos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: APK facts (commit, SHA-256, package, version, signature)
        if: always()
        run: |
          {
            echo "COMMIT ${GITHUB_SHA}"
            echo "RUN ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            echo "BUILT_AT_UTC $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
            for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
              [ -f "$apk" ] || continue
              echo "----- $apk -----"
              echo "SIZE_BYTES $(stat -c %s "$apk")"
              sha256sum "$apk"
              if [ -n "$BT" ]; then
                "$BT/aapt2" dump badging "$apk" 2>/dev/null | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^uses-permission:|^application-label:" || true
                "$BT/apksigner" verify --print-certs "$apk" 2>&1 | grep -E "Signer #1 certificate (DN|SHA-256)|Verifies" || true
              fi
            done
          } 2>&1 | tee apk-info.txt

      - name: Upload APK facts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-info
          path: apk-info.txt
          if-no-files-found: ignore

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            domain/build/reports/tests
            app/build/reports/tests
            app/build/test-results
            unit-results
            domain/build/test-results
          if-no-files-found: ignore

      - name: Test totals
        if: always()
        run: |
          python3 - <<'PY' | tee totals.txt
          import glob, re
          sources = {
              "domain": "domain/build/test-results",
              "app-unit": "unit-results",
              "app-ui": "app/build/test-results",
          }
          for module, root in sources.items():
              tests = fails = errs = skips = 0
              for f in glob.glob(f"{root}/**/*.xml", recursive=True):
                  m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', open(f, encoding="utf-8").read())
                  if m:
                      t, sk, fa, er = map(int, m.groups())
                      tests += t; skips += sk; fails += fa; errs += er
              print(f"TEST TOTALS {module}: tests={tests} failures={fails} errors={errs} skipped={skips}")
          PY

      - name: Room schema SQL (reference for migration tests)
        if: always()
        run: |
          python3 - <<'PY'
          import json, glob
          for f in sorted(glob.glob("app/schemas/*/*.json")):
              db = json.load(open(f, encoding="utf-8"))["database"]
              print("SCHEMA", f, "version", db["version"], "hash", db["identityHash"])
              for e in db["entities"]:
                  t = e["tableName"]
                  print("SQL", e["createSql"].replace("${TABLE_NAME}", t))
                  for i in e.get("indices", []):
                      print("SQL", i["createSql"].replace("${TABLE_NAME}", t))
          PY

      # Kept last on purpose: the end of the log is what gets read first.
      - name: Failure summary
        if: always()
        run: |
          echo "=============== FAILURE SUMMARY ==============="
          for f in test.log ui.log assemble.log release.log; do
            [ -f "$f" ] || continue
            echo "----- $f ($(grep -c . "$f") lines) -----"
            grep -E "^e: |error:|FAILED|What went wrong|Execution failed|Could not resolve|^\s+> |AssertionError|Exception|expected:|Caused by|Test.*FAILED|tests completed|\.kt:[0-9]+\)|Timed out|Could not tap|Reason:|Expected exactly|SCREEN:|text=\[|desc=\[|editable=\[" "$f" | grep -v "UP-TO-DATE" | awk '!seen[$0]++' | cut -c1-2200 | head -n 110
          done
          echo "----- totals -----"
          cat totals.txt 2>/dev/null || true
          echo "----- apk facts -----"
          cat apk-info.txt 2>/dev/null || true
          echo "=============== END SUMMARY ==============="

      # The UI step above is allowed to fail so that the APK is still built; this gate makes the run honest again:
      # the run is red when ANY test failed (UI tests included) or when the UI tests did not run at all.
      - name: Test gate
        if: always()
        run: |
          [ -f totals.txt ] || { echo "no totals.txt"; exit 1; }
          python3 - <<'PY'
          import re, sys
          bad = False
          for line in open("totals.txt", encoding="utf-8"):
              m = re.search(r"TEST TOTALS (\S+): tests=(\d+) failures=(\d+) errors=(\d+)", line)
              if not m:
                  continue
              module, tests, fails, errs = m.group(1), *map(int, m.groups()[1:])
              print(f"gate {module}: tests={tests} failures={fails} errors={errs}")
              if fails or errs or tests == 0:
                  bad = True
          sys.exit(1 if bad else 0)
          PY
          ls app/build/outputs/apk/release/*.apk
