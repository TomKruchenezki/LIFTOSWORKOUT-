name: Android CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Unit tests (domain + app)
        run: |
          set -o pipefail
          ./gradlew --console=plain --continue :domain:test :app:testDebugUnitTest 2>&1 | tee test.log

      - name: UI smoke tests (Compose on Robolectric)
        timeout-minutes: 12
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --console=plain :app:testDebugUnitTest -PuiTests --tests 'app.liftos.ui.*' 2>&1 | tee ui.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew --console=plain :app:assembleDebug 2>&1 | tee assemble.log

      - name: Assemble release APK (R8-minified)
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --console=plain :app:assembleRelease 2>&1 | tee release.log

      - name: Upload release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liftos-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: liftos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            domain/build/reports/tests
            app/build/reports/tests
            app/build/test-results
            domain/build/test-results
          if-no-files-found: ignore

      - name: Test totals
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          for module in ("domain", "app"):
              tests = fails = errs = skips = 0
              for f in glob.glob(f"{module}/build/test-results/**/*.xml", recursive=True):
                  m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', open(f, encoding="utf-8").read())
                  if m:
                      t, sk, fa, er = map(int, m.groups())
                      tests += t; skips += sk; fails += fa; errs += er
              print(f"TEST TOTALS {module}: tests={tests} failures={fails} errors={errs} skipped={skips}")
          PY

      # Kept last on purpose: the end of the log is what gets read first.
      - name: Failure summary
        if: always()
        run: |
          echo "=============== FAILURE SUMMARY ==============="
          for f in test.log ui.log assemble.log release.log; do
            [ -f "$f" ] || continue
            echo "----- $f ($(grep -c . "$f") lines) -----"
            grep -E "^e: |error:|FAILED|What went wrong|Execution failed|Could not resolve|^\s+> |AssertionError|Exception|expected:|Caused by|Test.*FAILED|tests completed" "$f" | grep -v "UP-TO-DATE" | awk '!seen[$0]++' | cut -c1-300 | head -n 45
          done
          echo "=============== END SUMMARY ==============="
