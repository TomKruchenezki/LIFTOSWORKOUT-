name: Android CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          java -version

      - name: Unit tests (domain + app)
        run: |
          set -o pipefail
          ./gradlew --console=plain --continue :domain:test :app:testDebugUnitTest 2>&1 | tee test.log

      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew --console=plain :app:assembleDebug 2>&1 | tee assemble.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: liftos-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Failure summary
        if: failure()
        run: |
          echo "=============== FAILURE SUMMARY ==============="
          for f in test.log assemble.log; do
            [ -f "$f" ] || continue
            echo "----- $f -----"
            grep -E "^e: |^w: .*(error)|error:|FAILED|What went wrong|Execution failed|Could not resolve|^\s+> |Test.*FAILED|AssertionError|Exception" "$f" | grep -v "^> Task .*UP-TO-DATE" | awk '!seen[$0]++' | head -n 90
          done
          echo "=============== END SUMMARY ==============="

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            domain/build/reports/tests
            app/build/reports/tests
          if-no-files-found: ignore
